# SearXNG for the ai4ra web_search tool. Merged over the image's defaults (use_default_settings).
# JSON output is what the tool reads; the limiter is off because there is no Redis and the only
# client is the ai4ra-mcp container on the compose network.
use_default_settings: true

general:
  instance_name: "ai4ra search"
  debug: false

server:
  secret_key: "change-me-in-the-environment"   # overridden by SEARXNG_SECRET in docker-compose.yml
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 2          # strict: the engines' own safe-search filters, applied to every query, cannot be lowered per request
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

# Text results only: the tool asks for general, news, science or it; images, videos, files, music,
# social media and map are not offered. Engines that serve adult content stay at the image's default (off).
categories_as_tabs:
  general:
  news:
  science:
  it:

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata          # slow and rarely useful here; it timed out on the first live search
    disabled: true

[project]
name = "ai4ra-mcp"
version = "0.1.0"
description = "One process, several MCP servers: eCFR, grants.gov, University of Idaho guidance, and an AI4RA catch-all."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.27",
  "httpx",
  "pydantic",
  "pypdf",
  "starlette",
  "uvicorn",
]

[project.scripts]
ai4ra-mcp = "ai4ra_mcp.app:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai4ra_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
